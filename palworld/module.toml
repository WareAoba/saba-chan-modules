[module]
schema_version = 1
name = "palworld"
version = "0.1.0"
description = "Palworld server management module"
author = "WareAoba"
game_name = "Palworld"
display_name = "Palworld"
entry = "lifecycle.py"
icon = "icon.png"
log_pattern = '(?P<level>Info|Warning|Error|Fatal|Debug)'

[module.dependencies]
saba-core = ">=0.1.2"
ext-steamcmd = ">=0.1.0"
ext-ue4-ini = ">=0.1.0"

[protocols]
supported = ["rest"]
default = "rest"
interaction_mode = "commands"  # console: stdin 지원, 콘솔 UI 표시 | commands: 정해진 명령어만 실행

# 데몬 표준 키 ↔ 게임별 설정 키 매핑 (자격증명 자동 동기화)
# Palworld의 AdminPassword가 곳 REST API 인증 비밀번호입니다.
[credential_map]
rest_password = "AdminPassword"  # daemon rest_password ↔ PalWorldSettings.ini AdminPassword

[config]
executable_path = "C:\\Program Files (x86)\\Steam\\steamapps\\common\\PalServer\\PalServer.exe"
server_executable = "PalServer.exe"
process_name = "PalServer-Win64-Shipping-Cmd"
default_port = 8211
stop_command = "Shutdown"  # stdin으로 전송하는 graceful 종료 명령어
announce_command = "announce"

[backup]
paths = ["Pal/Saved/SaveGames", "Pal/Saved/Config"]
save_command = "save"

# Shipping-Cmd는 stdout이 파이프면 끝날 때까지 모아 둔다(2026-10-16 실측). 의사 콘솔로 띄워 줄마다 받는다.
# Pal/Saved/Logs에는 .log가 생기지 않아 log_files는 쓰지 않는다.
[launch]
console = "pty"

[install]
method = "steamcmd"
app_id = 2394010
anonymous = true
install_subdir = "server"
platform = "windows"
requires_extensions = ["steamcmd", "ue4-ini"]

[detection]
process_patterns = ["PalServer-Win64-Shipping-Cmd", "PalServer", "PalServer-Win64"]
# dir_signatures: 디렉토리 내 파일 존재 여부로 게임 서버를 식별하는 패턴
# 배열의 각 항목은 AND 조건 (모두 존재해야 매칭)
dir_signatures = ["PalServer.exe"]
crash_artifacts = ["Pal/Saved/Crashes/*"]

[settings]

# ========== saba-chan 전용 설정 (PalWorldSettings.ini 아님) ==========

[[settings.fields]]
name = "rest_host"
type = "text"
label = "REST API Host"
description = "REST API host (default 127.0.0.1)"
default = "127.0.0.1"
group = "saba-chan"

[[settings.fields]]
name = "rest_port"
type = "number"
port = true
label = "REST API Port"
description = "REST API port (default 8212)"
default = 8212
min = 1
max = 65535
group = "saba-chan"

