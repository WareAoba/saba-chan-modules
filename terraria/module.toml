# ═══════════════════════════════════════════════════════════
#                       COMMANDS (콘솔, 위키 명령 목록 그대로)
# ═══════════════════════════════════════════════════════════
[commands]

[[commands.fields]]
name = "help"
risk = "safe"
label = "Help"
description = "List the server commands"
method = "console"
console_template = "help"
inputs = []

[[commands.fields]]
name = "playing"
risk = "safe"
label = "Players"
description = "List the connected players"
method = "console"
console_template = "playing"
inputs = []

[[commands.fields]]
name = "clear"
risk = "safe"
label = "Clear Console"
description = "Clear the server console"
method = "console"
console_template = "clear"
inputs = []
remote = false

[[commands.fields]]
name = "save"
risk = "safe"
label = "Save World"
description = "Save the world"
method = "console"
console_template = "save"
inputs = []

[[commands.fields]]
name = "say"
