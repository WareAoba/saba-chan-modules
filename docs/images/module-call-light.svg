<svg xmlns="http://www.w3.org/2000/svg" width="960" height="446" viewBox="0 0 960 446" role="img" aria-labelledby="t d" lang="ko" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, &#x27;Noto Sans KR&#x27;, sans-serif">
<title id="t">데몬이 모듈 함수를 부르는 방식</title>
<desc id="d">데몬은 함수마다 python lifecycle.py &lt;함수 이름&gt;을 새로 띄우고, stdin으로 설정 JSON을 넣고 stdout에서 결과 JSON을 읽는다. stderr는 로그와 PROGRESS 진행 상황이다.</desc>
<!-- 생성기: saba-chan docs/diagrams/build.py. 손으로 고치지 말고 생성기를 고친다. -->
<defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="445" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
<path d="M272.0 112.0 L620.0 112.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah0)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M620.0 170.0 L272.0 170.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah0)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M620.0 228.0 L272.0 228.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah0)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M620.0 286.0 L272.0 286.0" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah0)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="80" width="232" height="238" rx="12" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.65" stroke-width="1.5"/>
<text x="156.0" y="186.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle" data-fit="208.0">사바쨩 데몬</text>
<text x="156.0" y="208.8" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" data-fit="208.0">함수를 부를 때마다 새</text>
<text x="156.0" y="224.4" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" data-fit="208.0">Python 프로세스를 띄운다</text>
<rect x="620" y="80" width="300" height="238" rx="12" fill="#3b82f6" fill-opacity="0.09" stroke="#3b82f6" stroke-opacity="0.65" stroke-width="1.5"/>
<text x="770.0" y="184.9" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" data-fit="276.0">python lifecycle.py &lt;함수 이름&gt;</text>
<text x="770.0" y="206.8" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" data-fit="276.0">모듈 폴더의 설명서. 예: get_launch_command,</text>
<text x="770.0" y="222.4" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" data-fit="276.0">validate, install_server</text>
<rect x="360.7" y="99.2" width="170.6" height="25.6" rx="10.0" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="446.0" y="116.2" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle" data-fit="314.0">stdin · 설정 JSON (config)</text>
<rect x="321.2" y="157.2" width="249.5" height="25.6" rx="10.0" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="446.0" y="174.2" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle" data-fit="314.0">stdout · 결과 JSON (전체 또는 마지막 줄)</text>
<rect x="314.8" y="215.2" width="262.5" height="25.6" rx="10.0" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="446.0" y="232.2" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle" data-fit="314.0">stderr · 로그, PROGRESS:{json} 진행 상황</text>
<rect x="327.6" y="273.2" width="236.8" height="25.6" rx="10.0" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="446.0" y="290.2" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle" data-fit="314.0">(선택) 데몬 API 호출 · 토큰 파일로 인증</text>
<rect x="207.5" y="339.5" width="545.0" height="25.0" rx="10.0" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="480.0" y="356.0" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" data-fit="864.0">환경변수  SABA_IPC_URL · SABA_TOKEN_PATH · SABA_LANG · SABA_ENABLED_EXTENSIONS</text>
<text x="30.0" y="398.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" data-fit="900.0">답은 늘 success가 든 JSON 객체다. 실패해도 종료 코드 0으로 끝낸다(0이 아니면 데몬이 stdout을</text>
<text x="30.0" y="416.1" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" data-fit="900.0">버린다). Windows에서 확인되지 않은 모듈은 격리된 채 실행되어 데몬 API에 닿지 않는다.</text>
</svg>
