# ─── Commands (displayed in GUI command palette) ──────────────

[commands]
# 서버에 설치된 플러그인·모드 명령은 lifecycle instance_commands()가 준다 (plugins.py, plugin_catalog/)
hook = true
# 콘솔 답이 이 모양이면 디스코드 답이 실패로 알린다 (reason이 이유). 문구는 server jar en_us.json
# argument.entity.notfound.player·argument.entity.notfound.entity·command.unknown.command·command.unknown.argument·argument.item.id.invalid
# 로그 머리 바로 뒤에 온 줄만 (공지 `[Server] …`·채팅 `<이름> …` 본문의 같은 문구는 실패가 아니다)
failure_patterns = [
    '(?m)^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )[A-Z]+\](?: \[[^\]]*\])?: (?:System chat: )?(?P<reason>No player was found)',
    # tp·teleport의 대상이 없을 때 (argument.entity.notfound.entity, 클라우드 실측 26.1·26.3 전 종류)
    '(?m)^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )[A-Z]+\](?: \[[^\]]*\])?: (?:System chat: )?(?P<reason>No entity was found)',
    '(?m)^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )[A-Z]+\](?: \[[^\]]*\])?: (?:System chat: )?(?P<reason>Unknown or incomplete command)',
    '(?m)^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )[A-Z]+\](?: \[[^\]]*\])?: (?:System chat: )?(?P<reason>Incorrect argument for command)',
    '''(?m)^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )[A-Z]+\](?: \[[^\]]*\])?: (?:System chat: )?(?P<reason>Unknown item '[^']*')''',
    # Spigot(spigot.yml messages.unknown-command)·CraftBukkit의 모르는 명령 답 (실측 26.1·26.3)
    '(?m)^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )[A-Z]+\](?: \[[^\]]*\])?: (?P<reason>Unknown command)\. Type "/?help" for help\.',
]

