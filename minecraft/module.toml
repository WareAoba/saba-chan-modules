[module]
schema_version = 1
name = "minecraft"
version = "0.1.7"
description = "Minecraft server management module with full lifecycle control"
author = "WareAoba"
game_name = "Minecraft"
display_name = "Minecraft"
entry = "lifecycle.py"
icon = "icon.png"
# Vanilla·Forge·Fabric `[HH:MM:SS] [thread/LEVEL]`, Paper 콘솔 `[HH:MM:SS LEVEL]`
log_pattern = '^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )(?P<level>INFO|WARN|ERROR|DEBUG|FATAL)\]'

[module.dependencies]
saba-core = ">=0.1.11-0"

[permissions]
network = true          # 서버 파일 내려받기, 포트 확인
spawn_process = true    # 서버 실행 파일 호출, PID로 종료

[protocols]
supported = ["stdin"]
default = "stdin"
interaction_mode = "console"  # console: stdin 지원, 콘솔 UI 표시 | commands: 정해진 명령어만 실행

[config]
# 큰 월드는 정지 때 저장이 30초(기본)를 넘는다: 저장 도중 강제 종료되지 않게
stop_timeout = 120
executable_path = ""
server_executable = "server.jar"
process_name = "java.exe"
default_port = 25565
announce_command = "say"

# 월드 백업 (A2). Bukkit 계열은 네더·엔드를 따로 둔다 (없으면 빠진다)
[backup]
# 월드와 서버 루트의 데이터 파일(권한·밴·화이트리스트)과 설정. 없는 경로는 데몬이 뺀다
# (PaperMC 문서 "Vanilla data files"). eula.txt는 동의를 복원으로 대신하지 않도록 넣지 않는다
# 플러그인·모드 서버: plugins/·mods/(jar와 각 플러그인 데이터)와 config/, Bukkit 계열 설정 파일
# (PaperMC 문서 "Configuration"). 사바쨩이 다시 받아 주지 않으므로 넣는다. 캐시(.paper-remapped,
# libraries, logs)는 넣지 않는다. plugins/는 hook(backup_paths)이 다시 그릴 수 있는 지도 타일을 빼고 고른다
# (항목 단위라 복원은 백업에 든 플러그인만 되돌리고, 백업 뒤에 더한 플러그인 jar·폴더는 그대로 둔다)
paths = ["{level_name}", "{level_name}_nether", "{level_name}_the_end",
         "server.properties", "ops.json", "whitelist.json", "banned-players.json", "banned-ips.json",
         "mods", "config",
         "bukkit.yml", "spigot.yml", "commands.yml", "permissions.yml", "help.yml",
         "paper.yml", "purpur.yml", "pufferfish.yml"]
hook = true
# 켜진 서버: 자동 저장을 멈추고(save-off) 저장한 뒤 묶고, 끝나면 되돌린다(save-on). 서버가 잠가 두는 session.lock은 빼고
# (Windows에서 켜진 서버의 session.lock은 읽을 수 없다. 서버가 켜질 때 새로 만든다)
pause_command = "save-off"
save_command = "save-all"
resume_command = "save-on"
exclude = ["session.lock"]

[install]
method = "download"
# Minecraft은 공식 사이트에서 server.jar를 직접 다운로드
download_url = "https://piston-data.mojang.com/v1/objects/{version_hash}/server.jar"
install_subdir = "server"

[status]
# 켜진 서버의 접속자 수 (데몬이 1분마다 부른다)
players = "player_count"

[detection]
process_patterns = ["java.exe", "java", "minecraft_server", "server.jar"]
# cmd_patterns: java.exe 프로세스의 커맨드라인에서 Minecraft 서버를 식별하는 패턴
# 같은 java.exe를 쓰는 다른 게임 서버(예: Zomboid)와 구분하기 위해 사용
cmd_patterns = ["server.jar", "minecraft_server", "nogui", "net.minecraft", "paper-", "purpur-", "folia-", "fabric-server-launch", "net.minecraftforge", "net.neoforged"]
# dir_signatures: 디렉토리 내 파일 존재 여부로 게임 서버를 식별하는 패턴
# 배열의 각 항목은 AND 조건 (모두 존재해야 매칭). 항목 안의 |는 대안, *는 파일 이름 패턴 (saba-core 0.1.5부터)
dir_signatures = ["server.jar|paper-*.jar|purpur-*.jar|fabric-server-*.jar|minecraft_server.*.jar"]
# ready_patterns와 같은 로그 머리에 묶는다 (채팅에 친 문구로는 정상 종료로 갈리지 않게).
# 26.x는 stop 답 앞에 `System chat: `을 붙인다 (PC 정규 설치 26.3 파이프 실측)
graceful_exit_patterns = ['^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )INFO\](?: \[[^\]]*\])?: (?:System chat: )?Stopping the server']
crash_artifacts = ["crash-reports/*.txt", "hs_err_pid*.log"]

# 데몬이 읽는 0.1.9 선언. 0.1.8 데몬은 schema v1의 모르는 키를 거부하지만 [extensions.*] 표는 검사하지 않으므로
# 여기에 둔다 (예약 이름 saba-core, 계약 06 §4)
[extensions.saba-core]
# 게임 stdout 원문(데몬이 러너 머리 없이 맞춘다)의 줄 처음 로그 머리부터 맞춘다: 바닐라 `[시각] [스레드/INFO]: `,
# Paper 계열 `[시각 INFO]: ` (log_pattern과 같은 두 모양), Forge·NeoForge는 그 뒤에 로거 칸 ` [minecraft/로거]`
# (fmlloader log4j2.xml). 머리를 줄 처음에 묶어야 채팅에 "]: …"를 쳐도 맞지 않는다
# 접속을 받기 시작할 때의 줄 (데몬 instance.ready). PC 정규 설치 26.3 서버의 실제 줄에서 확인
ready_patterns = ['^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )INFO\](?: \[[^\]]*\])?: Done \(\d+(\.\d+)?s\)! For help, type "help"']
# 접속·퇴장 줄 (데몬 instance.player, name 그룹). 문구는 server jar en_us.json multiplayer.player.joined·
# joined.renamed·left (26.3에서 확인). 이름은 영숫자·밑줄 16자
player_join_patterns = [
    '^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )INFO\](?: \[[^\]]*\])?: (?P<name>[A-Za-z0-9_]{1,16}) joined the game\s*$',
    '^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )INFO\](?: \[[^\]]*\])?: (?P<name>[A-Za-z0-9_]{1,16}) \(formerly known as [A-Za-z0-9_]{1,16}\) joined the game\s*$',
]
# Spigot·CraftBukkit은 추방·밴으로 나갈 때 끝에 마침표를 찍는다 (`left the game.`, 클라우드 실측 26.1)
player_leave_patterns = ['^\[\d{2}:\d{2}:\d{2}(?:\] \[[^\]]*/| )INFO\](?: \[[^\]]*\])?: (?P<name>[A-Za-z0-9_]{1,16}) left the game\.?\s*$']

# ─── Settings (displayed in GUI for instance configuration) ───

[settings]

# ========== saba-chan 전용 설정 (server.properties 아님) ==========

[[settings.fields]]
name = "server_type"
type = "select"
label = "Server Type"
description = "Which server software runs this world. saba-chan can install every type. Spigot and CraftBukkit are built with the official BuildTools and take a few minutes; Pufferfish only has builds for some Minecraft versions."
options = ["vanilla", "paper", "folia", "purpur", "pufferfish", "spigot", "craftbukkit", "fabric", "quilt", "forge", "neoforge"]
default = "vanilla"
install = true
group = "saba-chan"

[[settings.fields]]
name = "java_path"
type = "file"
label = "Java Path"
description = "Path to Java executable (auto-detected if left blank)"
required = false
default = "java"
group = "saba-chan"

[[settings.fields]]
name = "ram"
type = "text"
# 크기 단위(K·M·G)가 붙은 값, 또는 예전에 GB 숫자로 저장된 값(4, 0.5)
pattern = '\d+[KMGkmg]|\d{1,3}(\.\d+)?'
arg = ["-Xmx{value}", "-Xms{value}"]
label = "Memory (RAM)"
description = "Java heap size: a number with K, M or G (e.g. 4G, 1024M)"
default = "4G"
group = "saba-chan"

[[settings.fields]]
name = "use_aikar_flags"
type = "boolean"
label = "Aikar's Flags"
description = "Use the recommended Java options for smoother performance"
default = false
arg = "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1"
group = "saba-chan"

[[settings.fields]]
name = "managed_start"
type = "boolean"
label = "Managed Start (Console)"
description = "Start the server through saba-runner so saba-chan can use its console. RCON stays off in every mode. If you turn this off, saba-chan cannot send commands to the server."
default = true
group = "saba-chan"

[[settings.fields]]
name = "graceful_stop"
type = "boolean"
label = "Graceful Stop"
description = "Send the 'stop' command and wait for the server to save and shut down. If you turn this off, saba-chan ends the server process at once."
default = true
group = "saba-chan"

