[module]
schema_version = 1
name = "palworld"
version = "0.1.6"
description = "Palworld server management module"
author = "WareAoba"
game_name = "Palworld"
display_name = "Palworld"
entry = "lifecycle.py"
icon = "icon.png"
log_pattern = '(?P<level>Info|Warning|Error|Fatal|Debug)'

[module.dependencies]
# [launch] line_start·[backup] snapshots는 0.1.10 발행본이 모르는 키다. 발행 전 main 데몬도 0.1.10으로 보고하므로
# 0.1.11을 발행할 때 ">=0.1.11-0"으로 올린다 (-0이 있어야 0.1.11-beta.N·rc.N 데몬도 받는다)
saba-core = ">=0.1.11-0"
ext-steamcmd = ">=0.1.5"
ext-ue4-ini = ">=0.1.5"

[permissions]
network = true          # 서버 파일 내려받기, 포트 확인
spawn_process = true    # 서버 실행 파일 호출, PID로 종료

[protocols]
supported = ["rest"]
default = "rest"
interaction_mode = "commands"  # console: stdin 지원, 콘솔 UI 표시 | commands: 정해진 명령어만 실행

# 데몬 표준 키 ↔ 게임별 설정 키 매핑 (자격증명 자동 동기화)
# Palworld의 AdminPassword가 곳 REST API 인증 비밀번호입니다.
[credential_map]
rest_password = "AdminPassword"  # daemon rest_password ↔ PalWorldSettings.ini AdminPassword

[config]
executable_path = "C:\\Program Files (x86)\\Steam\\steamapps\\common\\PalServer\\PalServer.exe"
server_executable = "PalServer.exe"
process_name = "PalServer-Win64-Shipping-Cmd"
default_port = 8211
stop_command = "Shutdown"  # stdin으로 전송하는 graceful 종료 명령어
stop_timeout = 60  # REST 저장·종료 뒤 끝나기를 기다리는 시간(초)
announce_command = "announce"

[backup]
# 세이브는 hook(backup_paths)이 월드 폴더에서 게임 자체 자동 백업(backup/)을 빼고 고른다
paths = ["Pal/Saved/Config"]
hook = true
save_command = "save"
# 게임 자동 백업(bIsUseBackupSaveData, backup/world/<시각>/)을 사바쨩 백업 목록에 보이고 보관·복원한다 (lifecycle backup_snapshots)
snapshots = true

# Shipping-Cmd는 stdout이 파이프면 끝날 때까지 모아 둔다(2026-10-16 실측). 의사 콘솔로 띄워 줄마다 받는다.
# Pal/Saved/Logs에는 .log가 생기지 않아 log_files는 쓰지 않는다.
# REST 접근 로그는 줄바꿈 없이 이어 써서(`... /v1/api/save OK[2026-10-26 01:20:26] [LOG] ...`, 2026-10-25 실측)
# 시각이 붙은 줄 머리마다 나눈다. `[LOG]`만으로 나누면 시각이 앞 줄에 남는다.
[launch]
console = "pty"
line_start = '\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\] \[LOG\]'

[install]
method = "steamcmd"
app_id = 2394010
anonymous = true
install_subdir = "server"
platform = "windows"
requires_extensions = ["steamcmd", "ue4-ini"]

[status]
# 켜진 서버의 접속자 수 (데몬이 1분마다 부른다)
players = "player_count"

[detection]
process_patterns = ["PalServer-Win64-Shipping-Cmd", "PalServer", "PalServer-Win64"]
# dir_signatures: 디렉토리 내 파일 존재 여부로 게임 서버를 식별하는 패턴
# 배열의 각 항목은 AND 조건 (모두 존재해야 매칭)
dir_signatures = ["PalServer.exe"]
crash_artifacts = ["Pal/Saved/Crashes/*"]

[settings]

# ========== saba-chan 전용 설정 (PalWorldSettings.ini 아님) ==========

[[settings.fields]]
name = "rest_host"
