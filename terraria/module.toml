# Terraria 공식 데디케이티드 서버 모듈. 조사 근거는 RESEARCH.md
[module]
schema_version = 1
name = "terraria"
version = "0.1.0"
description = "Terraria dedicated server"
game_name = "Terraria"
display_name = "Terraria"
entry = "lifecycle.py"
author = "WareAoba"

# safe_join·PathOutside·atomic_write
[module.dependencies]
saba-core = ">=0.1.10"
ext-xna = ">=0.1.0"

[permissions]
network = true

[protocols]
supported = ["stdin"]
default = "stdin"
interaction_mode = "console"

[config]
server_executable = "TerrariaServer.exe"
process_name = "TerrariaServer.exe"
default_port = 7777
# 위키: exit = 저장하고 종료
stop_command = "exit"
stop_timeout = 60
announce_command = "say"

# Windows 서버는 stdin이 파이프면 콘솔 입력을 읽지 않는다(2026-10-25 실측: help·seed·exit에 답 없음,
# 정지가 시간 초과로 강제 종료). 의사 콘솔로 띄운다
[launch]
console = "pty"

[install]
method = "download"
# Windows 서버는 XNA Framework 4.0이 있어야 뜬다. 고정 판을 서버 폴더에 두는 익스텐션 (Linux 서버는 쓰지 않는다)
requires_extensions = ["xna"]

[detection]
graceful_exit_patterns = ["^(?:: )?(?:Saving before exit\\.\\.\\.|Vor dem Verlassen speichern \\.\\.\\.|Salvataggio prima dell'uscita\\.\\.\\.|Enregistrement avant de quitter…|Guardando antes de salir\\.\\.\\.|Сохранение перед выходом\\.\\.\\.|正在进行退出前的保存……|Salvando antes de sair\\.\\.\\.|Zapisywanie przed wyjściem\\.\\.\\.|セーブ中…|종료 전에 저장하는 중\\.\\.\\.|離開前儲存中……)\\s*$"]
dir_signatures = ["TerrariaServer.exe|TerrariaServer.bin.x86_64"]

# 월드 폴더는 사용자가 서버 폴더 밖으로 고를 수 있다(가져온 서버의 Documents\My Games\Terraria\Worlds 등)
[extensions.saba-core]
data_roots = ["{world_dir}"]
# 진행 줄: 서버가 갱신마다 새 줄로 쓴다(실측: 파이프 원래 바이트도 CRLF, 일반 콘솔 창에서도 쌓인다). 월드 생성 한 번에 수만 줄이라
# 데몬이 단계마다 접는다 (saba-chan #605, 0.1.10은 모르는 키 경고로 무시)
progress_patterns = ['^\d+(?:\.\d+)?% - .+ - \d+(?:\.\d+)?%$', '^(?::\s*)?(?:Resetting game objects|Loading world data:|Saving world data:|Validating world save:|Settling liquids) \d+%$']
ready_patterns = ["^(?:: )?(?:Server started|Server gestartet|Server avviato|Serveur démarré|Servidor iniciado|Сервер запущен|服务器已启动|Servidor inicializado\\.|Serwer uruchomiony|サーバーが開始しました|서버 시작|伺服器已啟動)\\s*$"]

[backup]
hook = true
save_command = "save"

