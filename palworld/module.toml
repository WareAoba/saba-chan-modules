[commands]

[[commands.fields]]
name = "announce"
risk = "safe"
label = "Announce"
description = "Send a message to all players"
method = "rest"
http_method = "POST"
endpoint_template = "/v1/api/announce"
inputs = [
    { name = "message", type = "text", label = "Announcement Message", required = true, placeholder = "Enter announcement message" }
]

[[commands.fields]]
name = "info"
risk = "safe"
label = "Info"
description = "View server information"
method = "rest"
http_method = "GET"
endpoint_template = "/v1/api/info"
inputs = []

[[commands.fields]]
name = "players"
risk = "caution"
label = "Player List"
description = "List currently connected players"
method = "rest"
http_method = "GET"
endpoint_template = "/v1/api/players"
inputs = []
# 디스코드·챗봇의 접속자 목록은 데몬 `players`([status] players)가 한다
remote = false

[[commands.fields]]
name = "metrics"
risk = "safe"
label = "Metrics"
description = "View server FPS, player count and uptime"
method = "rest"
http_method = "GET"
endpoint_template = "/v1/api/metrics"
inputs = []

[[commands.fields]]
name = "settings"
risk = "safe"
label = "View Settings"
description = "View current server settings"
method = "rest"
http_method = "GET"
endpoint_template = "/v1/api/settings"
inputs = []

[[commands.fields]]
name = "save"
risk = "safe"
label = "Save World"
description = "Save the game world"
method = "rest"
http_method = "POST"
endpoint_template = "/v1/api/save"
inputs = []

[[commands.fields]]
name = "shutdown"
risk = "danger"
label = "Stop"
description = "Shutdown the server (with optional delay)"
method = "rest"
http_method = "POST"
endpoint_template = "/v1/api/shutdown"
inputs = [
    { name = "waittime", type = "number", label = "Shutdown Delay (seconds)", required = true, default = 30, min = 0, max = 600 },
    { name = "message", type = "text", label = "Shutdown Message", required = false, placeholder = "Server shutdown announcement" }
]

[[commands.fields]]
name = "kick"
risk = "danger"
label = "Kick Player"
description = "Kick a player from the server"
method = "rest"
http_method = "POST"
endpoint_template = "/v1/api/kick"
inputs = [
    { name = "userid", type = "text", label = "Player (Nickname or SteamID)", required = true, placeholder = "Player nickname or steam_xxxxxxxxx" },
    { name = "message", type = "text", label = "Kick Message", required = false, placeholder = "Optional: kick message" }
]

[[commands.fields]]
name = "ban"
risk = "danger"
label = "Ban Player"
description = "Permanently ban a player"
method = "rest"
http_method = "POST"
endpoint_template = "/v1/api/ban"
inputs = [
    { name = "userid", type = "text", label = "Player (Nickname or SteamID)", required = true, placeholder = "Player nickname or steam_xxxxxxxxx" },
    { name = "message", type = "text", label = "Ban Message", required = false, placeholder = "Optional: ban message" }
]

[[commands.fields]]
name = "unban"
risk = "danger"
label = "Unban Player"
description = "Unban a banned player"
method = "rest"
http_method = "POST"
endpoint_template = "/v1/api/unban"
inputs = [
    { name = "userid", type = "text", label = "Player (Nickname or SteamID)", required = true, placeholder = "Player nickname or steam_xxxxxxxxx" }
]

